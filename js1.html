
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript and HTML Calculator</title>
</head>
<body>

    <h3>This is a sample JavaScript and HTML document.</h3>

    <label for="num1">First number?</label>
    <input type="number" id="num1" value="45">
    <br>

    <label for="num2">Second number?</label>
    <input type="number" id="num2" value="7">
    <br>

    <button onclick="addNumbers()">Add the Numbers</button>

    <p id="result"><strong>You Answer is </strong></p>

    <script>
        function addNumbers() {
            let first = Number(document.getElementById("num1").value);
            let second = Number(document.getElementById("num2").value);
            let answer = first + second;

            document.getElementById("result").innerHTML =
                "<strong>You Answer is " + answer + "</strong>";
        }
    </script>

</body>
</html>
