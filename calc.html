

<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Calculator</title>
</head>
<body>

    <h1>This is a sample JavaScript and HTML document.</h1>

    <p>Enter two numbers:</p>

    <input type="number" id="num1" value="45">
    <input type="number" id="num2" value="7">

    <br><br>

    <button onclick="addNumbers()">Add the Numbers</button>
    <button onclick="subtractNumbers()">Subtract the Numbers</button>
    <button onclick="multiplyNumbers()">Multiply the Numbers</button>
    <button onclick="divideNumbers()">Divide the Numbers</button>
    <button onclick="powerNumbers()">Raise to a Power</button>

    <p id="result">Your Answer is:</p>

    <script>
        function addNumbers() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").innerHTML =
                "Your Answer is: " + (num1 + num2);
        }

        function subtractNumbers() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").innerHTML =
                "Your Answer is: " + (num1 - num2);
        }

        function multiplyNumbers() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").innerHTML =
                "Your Answer is: " + (num1 * num2);
        }

        function divideNumbers() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            if (num2 === 0) {
                document.getElementById("result").innerHTML =
                    "You cannot divide by zero.";
            } else {
                document.getElementById("result").innerHTML =
                    "Your Answer is: " + (num1 / num2);
            }
        }

        function powerNumbers() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").innerHTML =
                "Your Answer is: " + Math.pow(num1, num2);
        }
    </script>

</body>
</html>
